name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BASE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - name: Test production server
        shell: bash
        run: |
          npm start -- --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/faithful-care-next.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3100/; then
              npm test
              exit $?
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/faithful-care-next.log"
          exit 1
      - name: Test protected bilingual editorial UI with isolated local database
        shell: bash
        run: |
          node scripts/blog-dev.mjs > "$RUNNER_TEMP/faithful-care-blog.log" 2>&1 &
          blog_pid=$!
          trap 'kill "$blog_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3187/admin/login; then
              node --import tsx tests/blog-auto.e2e.mjs
              node tests/blog-ui.e2e.mjs
              node tests/blog-layout.e2e.mjs
              exit $?
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/faithful-care-blog.log"
          exit 1
